services:
  pythia-pgsql:
    image: postgres
    container_name: pythia-pgsql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    # PostgreSQL tuning: each value can be customized by setting the
    # corresponding variable in the environment or in an .env file
    # next to this file.
    # - random_page_cost: cost of a random page read for the planner; the
    #   default 4 fits spinning disks, while 1.1 fits SSDs and lets the
    #   planner choose index-driven plans (e.g. for span attribute searches).
    command: >
      postgres
      -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
    # shared memory (/dev/shm) used by parallel queries and index builds:
    # Docker's default (64MB) may cause error 53100 "could not resize shared
    # memory segment" (e.g. when building indexes on large tables)
    shm_size: ${PG_SHM_SIZE:-256mb}
    ports:
      - 5432:5432
    networks:
      - pythia-network
    volumes:
      # ensure you have created the var/db/pgsql folder in the host
      # https://hub.docker.com/r/postgis/postgis
      - /var/db/pgsql:/var/lib/postgresql/data

  pythia-api:
    image: vedph2020/pythia-api:5.0.5
    ports:
        # https://stackoverflow.com/questions/48669548/why-does-aspnet-core-start-on-port-80-from-within-docker
        - 5000:8080
    depends_on:
        - pythia-pgsql
    environment:
        - ASPNETCORE_URLS=http://+:8080
        # for Windows use : as separator, for non Windows use __
        # (see https://github.com/aspnet/Configuration/issues/469)
        - CONNECTIONSTRINGS__DEFAULT=User ID=postgres;Password=postgres;Host=pythia-pgsql;Port=5432;Database={0};
        # - ALLOWED__ORIGINS__3=http://www.something.com
        - SEEDDELAY=30
        - STOCKUSERS__0__PASSWORD=P4ss-W0rd!
        - MESSAGING__APIROOTURL=https://simpleblob.azurewebsites.net/api/
        - MESSAGING__APPROOTURL=https://fusisoft.it/apps/blob/
        - MESSAGING__SUPPORTEMAIL=webmaster@fusisoft.net
    networks:
        - pythia-network

networks:
  pythia-network:
    driver: bridge
